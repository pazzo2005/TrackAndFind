spring.application.name=warehouse

# FIXED: Changed 'localhost' to your docker-compose database service container endpoint name
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/warehouse_ledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:warehouse_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:supersecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# KEEP AS NONE since we verified your schemas are already perfectly populated manually!
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=8080
server.address=0.0.0.0

# REDIS CACHE ENGINE CONFIGURATION
spring.data.redis.host=redis-cache
spring.data.redis.port=6379