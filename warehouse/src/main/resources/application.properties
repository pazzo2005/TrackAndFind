spring.application.name=warehouse

# FIXED: Changed 'localhost' to your docker-compose database service container endpoint name
spring.datasource.url=jdbc:postgresql://postgres-db:5432/warehouse_ledger
spring.datasource.username=warehouse_admin
spring.datasource.password=supersecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# KEEP AS NONE since we verified your schemas are already perfectly populated manually!
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=8080
server.address=0.0.0.0

# REDIS CACHE ENGINE CONFIGURATION
spring.data.redis.host=redis-cache
spring.data.redis.port=6379